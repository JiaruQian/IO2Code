# DIO-Agent 配置文件 - Sum_Last2
max_iterations: 50
checkpoint_interval: 10
log_level: "INFO"

# LLM 配置
llm:
  models:
    - name: "deepseek/deepseek-v3.2"
      weight: 1.0
  
  evaluator_models:
    - name: "deepseek/deepseek-v3.2"
      weight: 1.0
  
  api_base: https://openrouter.ai/api/v1
  api_key: "${OPENROUTER_API_KEY}"
  temperature: 0.7
  top_p: 0.95
  max_tokens: 16384
  timeout: 60
  retries: 3

# Prompt 配置
prompt:
  system_message: |
    You are an expert programmer specializing in program synthesis from examples.
    
    Your task is to implement a function that works correctly on the given input-output examples.
    You need to infer the pattern from these examples and write code that generalizes to all test cases.
    
    **Training Examples (you can see these):**
        Example 1:
      Input:  [0, 8, 7, 7]
      Output: [0, 8, 15, 14]
    Example 2:
      Input:  [3, 17, 2, 18, 13]
      Output: [3, 20, 19, 20, 31]
    Example 3:
      Input:  [0, 2, 6]
      Output: [0, 2, 8]
    Example 4:
      Input:  [16, 19, 0, 17, 6, 20]
      Output: [16, 35, 19, 17, 23, 26]
    Example 5:
      Input:  [7, 14, 18, 8, 0, 5, 13, 10, 8]
      Output: [7, 21, 32, 26, 8, 5, 18, 23, 18]
    Example 6:
      Input:  [6, 10, 3, 2, 12]
      Output: [6, 16, 13, 5, 14]
    Example 7:
      Input:  [11, 11, 19, 8]
      Output: [11, 22, 30, 27]
    Example 8:
      Input:  [14, 17, 3]
      Output: [14, 31, 20]
    
    **IMPORTANT NOTES:**
    - These are TRAINING examples only (randomly generated with seed=42)
    - Your program will be evaluated on a SEPARATE TEST SET (seed=999) that you haven't seen
    - You must infer the GENERAL PATTERN, not memorize specific examples
    - The test set has different inputs than the training examples shown above
    
    **Requirements:**
    - Input: list
    - Output: list
    - The function must generalize to unseen examples
    - Don't hardcode mappings for specific inputs
    - Handle edge cases appropriately (empty lists, single elements, etc.)
    
    **Your goal:**
    Write a function that achieves 100% accuracy on the UNSEEN test set by learning the pattern from training examples.
  
  num_top_programs: 3
  num_diverse_programs: 2
  use_template_stochasticity: true
  include_artifacts: true
  max_artifact_bytes: 20480

# Database 配置
database:
  db_path: null
  in_memory: true
  log_prompts: true
  population_size: 100
  archive_size: 30
  num_islands: 3
  elite_selection_ratio: 0.2
  exploitation_ratio: 0.7
  similarity_threshold: 0.95

# Evaluator 配置
evaluator:
  timeout: 30
  cascade_evaluation: false
  cascade_thresholds: [0.5, 0.8]
  parallel_evaluations: 1

# Evolution 设置
diff_based_evolution: true
max_code_length: 10000
early_stopping_patience: 5
convergence_threshold: 0.001
early_stopping_metric: "combined_score"

process_parallel:
  num_workers: 1

evolution_trace:
  enabled: true
  format: "jsonl"
  include_code: true
  include_prompts: true
  output_path: null
  buffer_size: 1
  compress: false
