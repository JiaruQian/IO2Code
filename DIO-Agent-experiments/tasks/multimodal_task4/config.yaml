checkpoint_interval: 5
convergence_threshold: 0.001
database:
  archive_size: 30
  db_path: null
  elite_selection_ratio: 0.2
  exploitation_ratio: 0.7
  in_memory: true
  log_prompts: true
  num_islands: 3
  population_size: 100
  similarity_threshold: 0.95
diff_based_evolution: true
early_stopping_metric: combined_score
early_stopping_patience: 5
evaluator:
  cascade_evaluation: false
  cascade_thresholds:
  - 0.5
  - 0.8
  parallel_evaluations: 1
  timeout: 1800
llm:
  api_base: https://openrouter.ai/api/v1
  api_key: ${OPENROUTER_API_KEY}
  evaluator_models:
  - name: deepseek/deepseek-v3.2
    weight: 1.0
  max_tokens: 16384
  models:
  - name: deepseek/deepseek-v3.2
    weight: 1.0
  retries: 3
  temperature: 0.7
  timeout: 60
  top_p: 0.95
log_level: INFO
max_code_length: 14000
max_iterations: 12
process_parallel:
  num_workers: 1
evolution_trace:
  enabled: true
  format: jsonl
  include_code: true
  include_prompts: true
  output_path: null
  buffer_size: 1
  compress: false
prompt:
  include_artifacts: true
  max_artifact_bytes: 20480
  system_message: "You are solving a multimodal IO2Code task: infer the rule from training\
    \ (input, output) examples and implement solve(input_data) to return the integer\
    \ output for unseen images.\nYou can use tools in this list: [\"env MM_PARSE_MODEL\
    \ (a multimodal LLM)\", \"env OPENROUTER_API_KEY (to fetch models from OpenRouter)\"\
    , \"python\", \"numpy\", \"scipy\", \"PIL\", \"matplotlib\", \"seaborn\", \"scikit-learn\"\
    , \"scikit-image\", \"opencv-python\"].\n\n**Training Examples (you can see these):**\n\
    \nExample 1:\n  Input:  {'image_path': 'multimodal/data/multimodal_task4/train/images/image_001.png'}\n\
    \  Output: 2\nExample 2:\n  Input:  {'image_path': 'multimodal/data/multimodal_task4/train/images/image_002.png'}\n\
    \  Output: 1\nExample 3:\n  Input:  {'image_path': 'multimodal/data/multimodal_task4/train/images/image_003.png'}\n\
    \  Output: 3\nExample 4:\n  Input:  {'image_path': 'multimodal/data/multimodal_task4/train/images/image_004.png'}\n\
    \  Output: 2\nExample 5:\n  Input:  {'image_path': 'multimodal/data/multimodal_task4/train/images/image_005.png'}\n\
    \  Output: 2\nExample 6:\n  Input:  {'image_path': 'multimodal/data/multimodal_task4/train/images/image_006.png'}\n\
    \  Output: 2\nExample 7:\n  Input:  {'image_path': 'multimodal/data/multimodal_task4/train/images/image_007.png'}\n\
    \  Output: 2\nExample 8:\n  Input:  {'image_path': 'multimodal/data/multimodal_task4/train/images/image_008.png'}\n\
    \  Output: 1\n\n**IMPORTANT NOTES:**\n- These are TRAINING examples only.\n- Your\
    \ program will be evaluated on unseen test images.\n- Infer the general pattern,\
    \ do not hardcode by image path or id.\n\n**Requirements:**\n- Implement solve(input_data)\
    \ only.\n- Input format: dict with key image_path.\n- Output format: integer."
  num_top_programs: 2
  num_diverse_programs: 0
  num_inspirations: 1
  max_previous_attempts: 0
  use_template_stochasticity: true
